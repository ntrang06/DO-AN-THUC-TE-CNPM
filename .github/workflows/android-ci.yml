name: Android CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-check:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Platform 37
        run: sdkmanager "platforms;android-37.0"

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: bash ./gradlew :app:testDebugUnitTest --stacktrace